[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "winstorepackager"
version = "3.1.0"
description = "Desktop-App & CLI-Tool zur automatisierten Erstellung und Validierung von Windows Store MSIX-Paketen mit WACK-Integration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Lukas Geiger"}
]
keywords = [
    "msix",
    "windows-store",
    "wack",
    "packager",
    "appx",
    "tkinter",
    "desktop-app",
    "local-first",
    "llm-ready"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/file-bricks/WinStorePackager"
Repository = "https://github.com/file-bricks/WinStorePackager"
Documentation = "https://github.com/file-bricks/WinStorePackager#readme"
Issues = "https://github.com/file-bricks/WinStorePackager/issues"
Changelog = "https://github.com/file-bricks/WinStorePackager/blob/master/CHANGELOG.md"
Security = "https://github.com/file-bricks/WinStorePackager/blob/master/SECURITY.md"
"Parent Organization" = "https://github.com/file-bricks"
Umbrella = "https://github.com/open-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]


